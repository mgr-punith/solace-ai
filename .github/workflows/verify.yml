name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      # Vitest creates and removes its own local PostgreSQL container.
      # No Neon connection or repository database secret is used.
      - run: npm ci
      - run: npm run verify
      - run: npm run build
      - run: npm run export:android -w @solace/mobile
